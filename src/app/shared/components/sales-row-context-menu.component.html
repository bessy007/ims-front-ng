@if (open && row) {
  <div
    style="position: fixed; inset: 0; z-index: 1000"
    (click)="close.emit()"
    (contextmenu)="$event.preventDefault(); close.emit()"
  >
    <div
      style="position: fixed; min-width: 220px; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; box-shadow: 0 12px 28px rgba(15, 23, 42, 0.16); overflow: hidden"
      [style.left.px]="x"
      [style.top.px]="y"
      (click)="$event.stopPropagation()"
    >
      <button type="button" class="ims-btn-ghost" (click)="print.emit(row); close.emit()">Print</button>
      <button type="button" class="ims-btn-ghost" (click)="edit.emit(row); close.emit()">Open / Edit</button>
      <button type="button" class="ims-btn-ghost" (click)="makePayment.emit(row); close.emit()">Make Payment</button>
      <button type="button" class="ims-btn-ghost" (click)="fiscalize.emit(row); close.emit()">Fiscalize</button>
      <button type="button" class="ims-btn-ghost" (click)="remove.emit(row); close.emit()">Delete</button>
    </div>
  </div>
}
